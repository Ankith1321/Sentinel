# Run: copy .env.example to .env at the project root first, then
#   docker compose -f docker/docker-compose.yml up --build
services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped

